<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision numérique - OCR</title>
    <link rel="stylesheet" href="./frontend/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

    <!-- TITLE -->

    <div class="title">
        <h1>Vision numérique - OCR</h1>
        <b>Adrian Spycher</b>
    </div>

    <!-- MAIN -->

    <div class="container">

        <!-- CANVAS -->

        <div class="item container-canvas">
            <canvas id="canvas" width="20" height="20"></canvas>

            <div class="container-button">
                <button id="reset-canvas-button"><i class="fas fa-redo"></i></button>
                <button id="download-button"><i class="fas fa-download"></i></button>
            </div>
        </div>

        <!-- OUTPUT -->

        <div class="item container-progress">
            <div>0 <progress id="progress_0" max="1"></progress></div>
            <div>1 <progress id="progress_1" max="1"></progress></div>
            <div>2 <progress id="progress_2" max="1"></progress></div>
            <div>3 <progress id="progress_3" max="1"></progress></div>
            <div>4 <progress id="progress_4" max="1"></progress></div>
            <div>5 <progress id="progress_5" max="1"></progress></div>
            <div>6 <progress id="progress_6" max="1"></progress></div>
            <div>7 <progress id="progress_7" max="1"></progress></div>
            <div>8 <progress id="progress_8" max="1"></progress></div>
            <div>9 <progress id="progress_9" max="1"></progress></div>
        </div>


    </div>

    <!-- SCRIPT -->

    <script src="./frontend/script.js"></script>
</body>

</html>
